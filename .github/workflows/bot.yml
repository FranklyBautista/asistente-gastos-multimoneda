name: bot

on:
  push:
    branches: [main]
    paths: ["bot/**", "supabase/migrations/**", ".github/workflows/bot.yml"]
  pull_request:
    paths: ["bot/**", "supabase/migrations/**", ".github/workflows/bot.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest tests/unit -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,storage-api
      - run: uv sync --locked
        working-directory: bot
      - run: uv run pytest tests/integration -q -rs
        working-directory: bot
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
          REQUIRE_DB: "1"
